<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="1100" height="850" style="font-family:'Segoe UI',Arial,sans-serif;">
  <defs>
    <linearGradient id="bg_api" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e1b4b;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="1100" height="850" fill="url(#bg_api)"/>
  <text x="550" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="white">ITMS — API Route Architecture</text>
  <text x="550" y="62" text-anchor="middle" font-size="12" fill="#94a3b8">REST Endpoints &amp; WebSocket Events</text>
  <line x1="150" y1="75" x2="950" y2="75" stroke="#6d28d9" stroke-width="1.5"/>

  <!-- Web Socket Panel -->
  <rect x="50" y="100" width="280" height="710" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <text x="190" y="130" text-anchor="middle" font-size="13" font-weight="700" fill="#38bdf8">WebSocket Bus</text>
  <text x="190" y="150" text-anchor="middle" font-size="10" fill="#94a3b8">ws://127.0.0.1:3000/ws</text>

  <rect x="70" y="170" width="240" height="60" rx="6" fill="#1e293b"/>
  <text x="85" y="190" font-size="11" font-weight="600" fill="#e2e8f0">traffic:update</text>
  <text x="85" y="210" font-size="10" fill="#64748b">5 Hz · full city state &amp; congestion</text>

  <rect x="70" y="240" width="240" height="60" rx="6" fill="#1e293b"/>
  <text x="85" y="260" font-size="11" font-weight="600" fill="#e2e8f0">vehicle:update</text>
  <text x="85" y="280" font-size="10" fill="#64748b">5 Hz · pos/speed/angle</text>

  <rect x="70" y="310" width="240" height="60" rx="6" fill="#1e293b"/>
  <text x="85" y="330" font-size="11" font-weight="600" fill="#e2e8f0">signal:update</text>
  <text x="85" y="350" font-size="10" fill="#64748b">5 Hz · RYG state &amp; queues</text>

  <rect x="70" y="380" width="240" height="60" rx="6" fill="#1e293b"/>
  <text x="85" y="400" font-size="11" font-weight="600" fill="#34d399">prediction:update</text>
  <text x="85" y="420" font-size="10" fill="#64748b">2 Hz · ML forecasts</text>

  <rect x="70" y="450" width="240" height="60" rx="6" fill="#1e293b"/>
  <text x="85" y="470" font-size="11" font-weight="600" fill="#f87171">emergency:update</text>
  <text x="85" y="490" font-size="10" fill="#64748b">5 Hz · ETA and progress</text>

  <rect x="70" y="520" width="240" height="60" rx="6" fill="#1e293b"/>
  <text x="85" y="540" font-size="11" font-weight="600" fill="#10b981">corridor:update</text>
  <text x="85" y="560" font-size="10" fill="#64748b">5 Hz · window states</text>

  <rect x="70" y="590" width="240" height="60" rx="6" fill="#1e293b"/>
  <text x="85" y="610" font-size="11" font-weight="600" fill="#fbbf24">route:switched</text>
  <text x="85" y="630" font-size="10" fill="#64748b">On-event · A* dynamic routing</text>

  <rect x="70" y="660" width="240" height="60" rx="6" fill="#1e293b"/>
  <text x="85" y="680" font-size="11" font-weight="600" fill="#818cf8">comparison:update</text>
  <text x="85" y="700" font-size="10" fill="#64748b">On-event · scenario runner</text>

  <rect x="70" y="730" width="240" height="60" rx="6" fill="#1e293b"/>
  <text x="85" y="750" font-size="11" font-weight="600" fill="#94a3b8">system:alert &amp; heartbeat</text>
  <text x="85" y="770" font-size="10" fill="#64748b">Lifecycle &amp; liveness</text>

  <!-- REST API Panel -->
  <rect x="360" y="100" width="690" height="710" rx="10" fill="#0f172a" stroke="#6d28d9" stroke-width="2"/>
  <text x="705" y="130" text-anchor="middle" font-size="13" font-weight="700" fill="#a78bfa">REST API Structure</text>
  <text x="705" y="150" text-anchor="middle" font-size="10" fill="#94a3b8">http://127.0.0.1:3000</text>

  <!-- Simulation & Network -->
  <rect x="390" y="180" width="300" height="130" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="540" y="205" text-anchor="middle" font-size="11" font-weight="600" fill="#e2e8f0">Simulation &amp; Network</text>
  <text x="405" y="230" font-size="10" font-weight="600" fill="#38bdf8">POST /api/simulation/start</text>
  <text x="405" y="250" font-size="10" font-weight="600" fill="#38bdf8">GET  /api/simulation/state</text>
  <text x="405" y="270" font-size="10" font-weight="600" fill="#38bdf8">POST /api/simulation/speed</text>
  <text x="405" y="290" font-size="10" font-weight="600" fill="#38bdf8">GET  /api/network/geometry</text>

  <!-- Emergency Ops -->
  <rect x="720" y="180" width="300" height="130" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="870" y="205" text-anchor="middle" font-size="11" font-weight="600" fill="#f87171">Emergency Operations</text>
  <text x="735" y="230" font-size="10" font-weight="600" fill="#f87171">POST /api/emergency</text>
  <text x="735" y="250" font-size="10" font-weight="600" fill="#f87171">GET  /api/emergency</text>
  <text x="735" y="270" font-size="10" font-weight="600" fill="#f87171">GET  /api/emergency/:id</text>

  <!-- Corridor & Signals -->
  <rect x="390" y="340" width="300" height="130" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="540" y="365" text-anchor="middle" font-size="11" font-weight="600" fill="#10b981">Corridors &amp; Signals</text>
  <text x="405" y="390" font-size="10" font-weight="600" fill="#10b981">POST /api/corridors</text>
  <text x="405" y="410" font-size="10" font-weight="600" fill="#10b981">GET  /api/corridors</text>
  <text x="405" y="430" font-size="10" font-weight="600" fill="#10b981">GET  /api/corridors/:id</text>
  <text x="405" y="450" font-size="10" font-weight="600" fill="#34d399">POST /api/signals/:id/state</text>

  <!-- Traffic & Predictions -->
  <rect x="720" y="340" width="300" height="130" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="870" y="365" text-anchor="middle" font-size="11" font-weight="600" fill="#a78bfa">Traffic &amp; Intelligence</text>
  <text x="735" y="390" font-size="10" font-weight="600" fill="#a78bfa">GET  /api/traffic</text>
  <text x="735" y="410" font-size="10" font-weight="600" fill="#a78bfa">GET  /api/traffic/intersections</text>
  <text x="735" y="430" font-size="10" font-weight="600" fill="#818cf8">GET  /api/predictions</text>
  <text x="735" y="450" font-size="10" font-weight="600" fill="#818cf8">GET  /api/decisions</text>

  <!-- Analytics & Scenarios -->
  <rect x="390" y="500" width="300" height="130" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="540" y="525" text-anchor="middle" font-size="11" font-weight="600" fill="#fbbf24">Scenarios &amp; Analytics</text>
  <text x="405" y="550" font-size="10" font-weight="600" fill="#fbbf24">POST /api/scenarios/compare</text>
  <text x="405" y="570" font-size="10" font-weight="600" fill="#fbbf24">GET  /api/scenarios/compare/:jobId</text>
  <text x="405" y="590" font-size="10" font-weight="600" fill="#fbbf24">GET  /api/analytics</text>
  <text x="405" y="610" font-size="10" font-weight="600" fill="#fbbf24">GET  /api/scenarios/runs</text>

  <!-- Mobile API -->
  <rect x="720" y="500" width="300" height="130" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="870" y="525" text-anchor="middle" font-size="11" font-weight="600" fill="#94a3b8">Mobile API</text>
  <text x="735" y="550" font-size="10" font-weight="600" fill="#94a3b8">POST /api/mobile/auth/login</text>
  <text x="735" y="570" font-size="10" font-weight="600" fill="#94a3b8">GET  /api/mobile/emergency/active</text>
  <text x="735" y="590" font-size="10" font-weight="600" fill="#94a3b8">POST /api/mobile/emergency/:id/evidence</text>
  <text x="735" y="610" font-size="10" font-weight="600" fill="#94a3b8">POST /api/mobile/telemetry</text>
  
  <text x="705" y="700" text-anchor="middle" font-size="11" fill="#475569">24+ Endpoints · Full Swagger/OpenAPI compliant</text>
</svg>
