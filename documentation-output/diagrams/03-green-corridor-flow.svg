<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" style="font-family: 'Segoe UI', Arial, sans-serif;">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e1b4b;stop-opacity:1" />
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6d28d9"/>
    </marker>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <text x="600" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="white">ITMS — Predictive Green Corridor Flow</text>
  <text x="600" y="62" text-anchor="middle" font-size="12" fill="#94a3b8">End-to-end process from emergency dispatch to signal restoration</text>
  <line x1="150" y1="72" x2="1050" y2="72" stroke="#6d28d9" stroke-width="1.5"/>

  <!-- Flow boxes -->
  <!-- Step 1 -->
  <rect x="50" y="100" width="200" height="70" rx="10" fill="#1e293b" stroke="#6d28d9" stroke-width="2"/>
  <text x="150" y="125" text-anchor="middle" font-size="11" font-weight="700" fill="#a78bfa">1. EMERGENCY CREATED</text>
  <text x="150" y="143" text-anchor="middle" font-size="10" fill="#94a3b8">POST /api/emergency</text>
  <text x="150" y="158" text-anchor="middle" font-size="10" fill="#64748b">Type · Priority · Origin · Dest</text>

  <line x1="250" y1="135" x2="310" y2="135" stroke="#6d28d9" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 2 -->
  <rect x="310" y="100" width="200" height="70" rx="10" fill="#1e293b" stroke="#6d28d9" stroke-width="2"/>
  <text x="410" y="125" text-anchor="middle" font-size="11" font-weight="700" fill="#a78bfa">2. A* ROUTE COMPUTED</text>
  <text x="410" y="143" text-anchor="middle" font-size="10" fill="#94a3b8">Congestion-weighted graph</text>
  <text x="410" y="158" text-anchor="middle" font-size="10" fill="#64748b">Admissible heuristic (Euclidean)</text>

  <line x1="510" y1="135" x2="570" y2="135" stroke="#6d28d9" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 3 -->
  <rect x="570" y="100" width="200" height="70" rx="10" fill="#1e293b" stroke="#6d28d9" stroke-width="2"/>
  <text x="670" y="125" text-anchor="middle" font-size="11" font-weight="700" fill="#a78bfa">3. VEHICLE SPAWNED</text>
  <text x="670" y="143" text-anchor="middle" font-size="10" fill="#94a3b8">TraCI: route.add + vehicle.add</text>
  <text x="670" y="158" text-anchor="middle" font-size="10" fill="#64748b">SUMO step-by-step tracking</text>

  <line x1="770" y1="135" x2="830" y2="135" stroke="#6d28d9" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 4 -->
  <rect x="830" y="100" width="200" height="70" rx="10" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
  <text x="930" y="125" text-anchor="middle" font-size="11" font-weight="700" fill="#818cf8">4. ETA COMPUTED</text>
  <text x="930" y="143" text-anchor="middle" font-size="10" fill="#94a3b8">Per-junction ahead on route</text>
  <text x="930" y="158" text-anchor="middle" font-size="10" fill="#64748b">Live speed × progress factor</text>

  <!-- Vertical arrow down -->
  <line x1="930" y1="170" x2="930" y2="230" stroke="#818cf8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 5 -->
  <rect x="830" y="230" width="200" height="70" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="930" y="254" text-anchor="middle" font-size="11" font-weight="700" fill="#38bdf8">5. ML PREDICTION</text>
  <text x="930" y="272" text-anchor="middle" font-size="10" fill="#94a3b8">XGBoost: traffic at ETA+30/60/90/120s</text>
  <text x="930" y="287" text-anchor="middle" font-size="10" fill="#64748b">R² = 0.911 (30s) · 4.53ms latency</text>

  <line x1="830" y1="265" x2="770" y2="265" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 6 -->
  <rect x="570" y="230" width="200" height="70" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="670" y="254" text-anchor="middle" font-size="11" font-weight="700" fill="#38bdf8">6. WINDOW PLANNING</text>
  <text x="670" y="272" text-anchor="middle" font-size="10" fill="#94a3b8">SWITCH / EXTEND / NOOP</text>
  <text x="670" y="287" text-anchor="middle" font-size="10" fill="#64748b">Lead:12s · Trail:12s · Max:30s</text>

  <line x1="570" y1="265" x2="510" y2="265" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 7 -->
  <rect x="310" y="230" width="200" height="70" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="410" y="254" text-anchor="middle" font-size="11" font-weight="700" fill="#fbbf24">7. SAFETY VALIDATION</text>
  <text x="410" y="272" text-anchor="middle" font-size="10" fill="#94a3b8">8 safety constraints checked</text>
  <text x="410" y="287" text-anchor="middle" font-size="10" fill="#64748b">Reject → SKIPPED + reason logged</text>

  <line x1="310" y1="265" x2="250" y2="265" stroke="#f59e0b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 8 -->
  <rect x="50" y="230" width="200" height="70" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="150" y="254" text-anchor="middle" font-size="11" font-weight="700" fill="#34d399">8. CORRIDOR ACTIVE</text>
  <text x="150" y="272" text-anchor="middle" font-size="10" fill="#94a3b8">Status: PLANNING → ACTIVE</text>
  <text x="150" y="287" text-anchor="middle" font-size="10" fill="#64748b">DB persisted · WS broadcast</text>

  <!-- Down arrow for rolling execution -->
  <line x1="150" y1="300" x2="150" y2="360" stroke="#10b981" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Rolling Executor box -->
  <rect x="50" y="360" width="1100" height="140" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
  <text x="600" y="385" text-anchor="middle" font-size="12" font-weight="700" fill="#34d399">9. ROLLING EXECUTOR (Per Simulation Step)</text>

  <rect x="80" y="400" width="190" height="70" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="175" y="422" text-anchor="middle" font-size="10" font-weight="600" fill="#e2e8f0">APPLY Phase</text>
  <text x="175" y="438" text-anchor="middle" font-size="9" fill="#64748b">Vehicle within lead time?</text>
  <text x="175" y="452" text-anchor="middle" font-size="9" fill="#64748b">→ TraCI setRYGState</text>
  <text x="175" y="466" text-anchor="middle" font-size="9" fill="#10b981">Status: PENDING → APPLIED</text>

  <rect x="290" y="400" width="190" height="70" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="385" y="422" text-anchor="middle" font-size="10" font-weight="600" fill="#e2e8f0">CLEARANCE Phase</text>
  <text x="385" y="438" text-anchor="middle" font-size="9" fill="#64748b">Cutting live green?</text>
  <text x="385" y="452" text-anchor="middle" font-size="9" fill="#64748b">→ Insert 3s yellow first</text>
  <text x="385" y="466" text-anchor="middle" font-size="9" fill="#fbbf24">Safety: no abrupt changes</text>

  <rect x="500" y="400" width="190" height="70" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="595" y="422" text-anchor="middle" font-size="10" font-weight="600" fill="#e2e8f0">TRACK Phase</text>
  <text x="595" y="438" text-anchor="middle" font-size="9" fill="#64748b">Update ETA every step</text>
  <text x="595" y="452" text-anchor="middle" font-size="9" fill="#64748b">Drift &gt; 4s → REPLAN</text>
  <text x="595" y="466" text-anchor="middle" font-size="9" fill="#818cf8">Rolling horizon update</text>

  <rect x="710" y="400" width="190" height="70" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="805" y="422" text-anchor="middle" font-size="10" font-weight="600" fill="#e2e8f0">PASSAGE Detection</text>
  <text x="805" y="438" text-anchor="middle" font-size="9" fill="#64748b">Vehicle passed junction?</text>
  <text x="805" y="452" text-anchor="middle" font-size="9" fill="#64748b">→ TraCI setProgram (restore)</text>
  <text x="805" y="466" text-anchor="middle" font-size="9" fill="#38bdf8">Status: APPLIED → PASSED</text>

  <rect x="920" y="400" width="190" height="70" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="1015" y="422" text-anchor="middle" font-size="10" font-weight="600" fill="#e2e8f0">ARRIVAL Detection</text>
  <text x="1015" y="438" text-anchor="middle" font-size="9" fill="#64748b">VAR_ARRIVED_VEHICLES</text>
  <text x="1015" y="452" text-anchor="middle" font-size="9" fill="#64748b">→ Corridor COMPLETED</text>
  <text x="1015" y="466" text-anchor="middle" font-size="9" fill="#a78bfa">All signals restored</text>

  <!-- Final arrow down -->
  <line x1="600" y1="500" x2="600" y2="555" stroke="#6d28d9" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 10: Done -->
  <rect x="400" y="555" width="400" height="60" rx="12" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="600" y="580" text-anchor="middle" font-size="13" font-weight="700" fill="#4ade80">10. MISSION COMPLETE</text>
  <text x="600" y="600" text-anchor="middle" font-size="11" fill="#94a3b8">Emergency arrived · All signals restored · Metrics recorded</text>

  <!-- Safety details box -->
  <rect x="50" y="635" width="530" height="210" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="315" y="658" text-anchor="middle" font-size="12" font-weight="700" fill="#fbbf24">8 Safety Constraints</text>
  <text x="70" y="678" font-size="10" fill="#94a3b8">1. Priority Gate — min priority: normal/high/critical</text>
  <text x="70" y="696" font-size="10" fill="#94a3b8">2. Window Bounds — within [8s, 30s]</text>
  <text x="70" y="714" font-size="10" fill="#94a3b8">3. Max Red Extension — ≤ 45s for cross-traffic</text>
  <text x="70" y="732" font-size="10" fill="#94a3b8">4. Yellow Clearance — 3s yellow before cutting live green</text>
  <text x="70" y="750" font-size="10" fill="#94a3b8">5. Conflict-Free State — only approach links get green</text>
  <text x="70" y="768" font-size="10" fill="#94a3b8">6. Downstream Capacity — occupancy &lt; 85% required</text>
  <text x="70" y="786" font-size="10" fill="#94a3b8">7. Corridor Conflict — yield to higher-priority corridor</text>
  <text x="70" y="804" font-size="10" fill="#94a3b8">8. Bounded Override — cannot hold indefinitely</text>
  <text x="315" y="832" text-anchor="middle" font-size="9" fill="#475569">All rejections are logged to DB and visible in AI Decision Trace</text>

  <!-- Route switching box -->
  <rect x="620" y="635" width="530" height="210" rx="12" fill="#0f172a" stroke="#818cf8" stroke-width="1.5"/>
  <text x="885" y="658" text-anchor="middle" font-size="12" font-weight="700" fill="#818cf8">Closed-Loop Route Switching</text>
  <text x="640" y="678" font-size="10" fill="#94a3b8">Eval Cadence: every 3s (sim-time)</text>
  <text x="640" y="696" font-size="10" fill="#94a3b8">Route Reeval: every 5s (sim-time)</text>
  <text x="640" y="720" font-size="10" fill="#64748b">Hysteresis Safeguards:</text>
  <text x="640" y="738" font-size="10" fill="#94a3b8">  • Min improvement: 8s absolute OR 15% relative</text>
  <text x="640" y="756" font-size="10" fill="#94a3b8">  • Cooldown: 30s between switches</text>
  <text x="640" y="774" font-size="10" fill="#94a3b8">  • Max 3 switches per emergency</text>
  <text x="640" y="792" font-size="10" fill="#94a3b8">  • No switch within 15s of destination</text>
  <text x="640" y="810" font-size="10" fill="#94a3b8">  • No switch while crossing intersection</text>
  <text x="885" y="832" text-anchor="middle" font-size="9" fill="#475569">Every switch persisted to emergency_route_switches table</text>

  <text x="600" y="878" text-anchor="middle" font-size="10" fill="#475569">Bitcoders · SISTec Innovation Hackathon 2026 · Problem Statement IS-8</text>
</svg>
