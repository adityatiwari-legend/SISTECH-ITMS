<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" style="font-family: 'Segoe UI', Arial, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#24243e;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6d28d9"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10b981"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgGrad)"/>
  
  <!-- Title -->
  <text x="600" y="45" text-anchor="middle" font-size="22" font-weight="700" fill="white">ITMS — System Architecture</text>
  <text x="600" y="68" text-anchor="middle" font-size="13" fill="#94a3b8">Intelligent Traffic Management System · Predictive Green Corridor</text>
  <line x1="200" y1="78" x2="1000" y2="78" stroke="#6d28d9" stroke-width="2"/>

  <!-- Layer 1: Frontend -->
  <rect x="380" y="95" width="440" height="90" rx="12" fill="#1e293b" stroke="#6d28d9" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="120" text-anchor="middle" font-size="11" fill="#94a3b8" letter-spacing="1">LAYER 1 — PRESENTATION</text>
  <text x="600" y="142" text-anchor="middle" font-size="16" font-weight="700" fill="#a78bfa">Command Center UI</text>
  <text x="600" y="162" text-anchor="middle" font-size="11" fill="#64748b">Next.js 15 · React 19 · Tailwind v4 · Recharts · SVG Map</text>
  <text x="600" y="178" text-anchor="middle" font-size="11" fill="#64748b">13 Pages · WebSocket Client · Real-time 5Hz Updates</text>

  <!-- Arrow: Frontend to Backend (REST) -->
  <line x1="600" y1="186" x2="600" y2="218" stroke="#6d28d9" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="540" y="193" width="120" height="20" rx="10" fill="#1e293b"/>
  <text x="600" y="207" text-anchor="middle" font-size="10" fill="#94a3b8">REST + WebSocket</text>

  <!-- Layer 2: Backend -->
  <rect x="120" y="220" width="960" height="160" rx="12" fill="#1e293b" stroke="#818cf8" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="243" text-anchor="middle" font-size="11" fill="#94a3b8" letter-spacing="1">LAYER 2 — CONTROL &amp; ORCHESTRATION</text>
  <text x="600" y="265" text-anchor="middle" font-size="16" font-weight="700" fill="#818cf8">Node.js Backend (Fastify + TypeScript)</text>

  <!-- Backend modules -->
  <rect x="140" y="275" width="130" height="52" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="205" y="295" text-anchor="middle" font-size="10" font-weight="600" fill="#e2e8f0">Simulation Manager</text>
  <text x="205" y="310" text-anchor="middle" font-size="9" fill="#64748b">SUMO lifecycle</text>
  <text x="205" y="323" text-anchor="middle" font-size="9" fill="#64748b">step executor</text>

  <rect x="285" y="275" width="130" height="52" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="350" y="295" text-anchor="middle" font-size="10" font-weight="600" fill="#e2e8f0">Traffic Collector</text>
  <text x="350" y="310" text-anchor="middle" font-size="9" fill="#64748b">metrics per step</text>
  <text x="350" y="323" text-anchor="middle" font-size="9" fill="#64748b">congestion classify</text>

  <rect x="430" y="275" width="130" height="52" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="495" y="295" text-anchor="middle" font-size="10" font-weight="600" fill="#e2e8f0">Emergency Service</text>
  <text x="495" y="310" text-anchor="middle" font-size="9" fill="#64748b">dispatch · track</text>
  <text x="495" y="323" text-anchor="middle" font-size="9" fill="#64748b">ETA · arrival detect</text>

  <rect x="575" y="275" width="130" height="52" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="640" y="295" text-anchor="middle" font-size="10" font-weight="600" fill="#e2e8f0">Route Engine (A*)</text>
  <text x="640" y="310" text-anchor="middle" font-size="9" fill="#64748b">congestion weights</text>
  <text x="640" y="323" text-anchor="middle" font-size="9" fill="#64748b">hysteresis guard</text>

  <rect x="720" y="275" width="130" height="52" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="785" y="295" text-anchor="middle" font-size="10" font-weight="600" fill="#e2e8f0">Corridor Service</text>
  <text x="785" y="310" text-anchor="middle" font-size="9" fill="#64748b">window planning</text>
  <text x="785" y="323" text-anchor="middle" font-size="9" fill="#64748b">safety · execution</text>

  <rect x="865" y="275" width="130" height="52" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="930" y="295" text-anchor="middle" font-size="10" font-weight="600" fill="#e2e8f0">Closed Loop</text>
  <text x="930" y="310" text-anchor="middle" font-size="9" fill="#64748b">3s eval cadence</text>
  <text x="930" y="323" text-anchor="middle" font-size="9" fill="#64748b">reroute · replan</text>

  <text x="600" y="365" text-anchor="middle" font-size="11" fill="#64748b">Also: WsBus · Prediction Client · Scenario Runner · Metrics Recorder · AI Copilot · Mobile API · Device Service</text>

  <!-- Arrows from Backend to bottom layers -->
  <line x1="350" y1="381" x2="220" y2="448" stroke="#6d28d9" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="381" x2="600" y2="448" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="850" y1="381" x2="980" y2="448" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Layer 3a: Database -->
  <rect x="100" y="450" width="280" height="120" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="240" y="474" text-anchor="middle" font-size="11" fill="#94a3b8" letter-spacing="1">DATA LAYER</text>
  <text x="240" y="496" text-anchor="middle" font-size="16" font-weight="700" fill="#fbbf24">PostgreSQL 16 + PostGIS</text>
  <text x="240" y="516" text-anchor="middle" font-size="10" fill="#64748b">26+ tables across 10 migrations</text>
  <text x="240" y="532" text-anchor="middle" font-size="10" fill="#64748b">simulation_runs · intersections · roads</text>
  <text x="240" y="548" text-anchor="middle" font-size="10" fill="#64748b">emergency_vehicles · green_corridors</text>
  <text x="240" y="564" text-anchor="middle" font-size="10" fill="#64748b">traffic_predictions · comparisons</text>

  <!-- Layer 3b: SUMO -->
  <rect x="460" y="450" width="280" height="120" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="474" text-anchor="middle" font-size="11" fill="#94a3b8" letter-spacing="1">SIMULATION LAYER</text>
  <text x="600" y="496" text-anchor="middle" font-size="16" font-weight="700" fill="#38bdf8">Eclipse SUMO 1.27.1</text>
  <text x="600" y="516" text-anchor="middle" font-size="10" fill="#64748b">TraCI TCP Client (raw binary protocol)</text>
  <text x="600" y="532" text-anchor="middle" font-size="10" fill="#64748b">Reads: position · speed · angle · phase</text>
  <text x="600" y="548" text-anchor="middle" font-size="10" fill="#64748b">Writes: signal state · spawn vehicles</text>
  <text x="600" y="564" text-anchor="middle" font-size="10" fill="#64748b">Grid (6 junctions) · City (Bhopal)</text>

  <!-- Layer 3c: ML -->
  <rect x="820" y="450" width="280" height="120" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <text x="960" y="474" text-anchor="middle" font-size="11" fill="#94a3b8" letter-spacing="1">INTELLIGENCE LAYER</text>
  <text x="960" y="496" text-anchor="middle" font-size="16" font-weight="700" fill="#34d399">Python XGBoost</text>
  <text x="960" y="516" text-anchor="middle" font-size="10" fill="#64748b">4 models: 30 / 60 / 90 / 120s horizons</text>
  <text x="960" y="532" text-anchor="middle" font-size="10" fill="#64748b">R² = 0.911 (30s) · 4.53ms latency</text>
  <text x="960" y="548" text-anchor="middle" font-size="10" fill="#64748b">FastAPI service · port 8100</text>
  <text x="960" y="564" text-anchor="middle" font-size="10" fill="#64748b">Deterministic fallback on failure</text>

  <!-- Key Metrics Bar -->
  <rect x="100" y="600" width="1000" height="90" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="600" y="622" text-anchor="middle" font-size="11" fill="#94a3b8" letter-spacing="1">VERIFIED PERFORMANCE METRICS</text>
  
  <text x="200" y="652" text-anchor="middle" font-size="22" font-weight="700" fill="#a78bfa">−49.4%</text>
  <text x="200" y="672" text-anchor="middle" font-size="10" fill="#94a3b8">Emergency Travel Time</text>
  
  <text x="400" y="652" text-anchor="middle" font-size="22" font-weight="700" fill="#34d399">0.911</text>
  <text x="400" y="672" text-anchor="middle" font-size="10" fill="#94a3b8">ML R² (30s horizon)</text>
  
  <text x="600" y="652" text-anchor="middle" font-size="22" font-weight="700" fill="#fbbf24">132</text>
  <text x="600" y="672" text-anchor="middle" font-size="10" fill="#94a3b8">Tests Passing</text>
  
  <text x="800" y="652" text-anchor="middle" font-size="22" font-weight="700" fill="#f87171">+70.8%</text>
  <text x="800" y="672" text-anchor="middle" font-size="10" fill="#94a3b8">Network Throughput</text>
  
  <text x="1000" y="652" text-anchor="middle" font-size="22" font-weight="700" fill="#38bdf8">7/7</text>
  <text x="1000" y="672" text-anchor="middle" font-size="10" fill="#94a3b8">Phases Complete</text>

  <!-- Bottom credit -->
  <text x="600" y="780" text-anchor="middle" font-size="10" fill="#475569">Bitcoders · SISTec Innovation Hackathon 2026 · Problem Statement IS-8</text>
</svg>
