<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 780" width="1100" height="780" style="font-family:'Segoe UI',Arial,sans-serif;">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <marker id="arw" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6d28d9"/>
    </marker>
    <marker id="arw2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981"/>
    </marker>
  </defs>
  <rect width="1100" height="780" fill="url(#bg2)"/>
  <text x="550" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="white">ITMS — XGBoost ML Traffic Prediction Pipeline</text>
  <text x="550" y="56" text-anchor="middle" font-size="11" fill="#94a3b8">Training data from SUMO runs · 4-horizon prediction · FastAPI service</text>
  <line x1="80" y1="66" x2="1020" y2="66" stroke="#6d28d9" stroke-width="1.5"/>

  <!-- Training pipeline (left section) -->
  <text x="280" y="92" text-anchor="middle" font-size="12" font-weight="700" fill="#fbbf24">TRAINING PIPELINE (Offline)</text>

  <!-- SUMO Runs box -->
  <rect x="60" y="105" width="180" height="100" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="150" y="128" text-anchor="middle" font-size="11" font-weight="600" fill="#38bdf8">SUMO Simulation</text>
  <text x="150" y="147" text-anchor="middle" font-size="9" fill="#94a3b8">40 simulation runs</text>
  <text x="150" y="162" text-anchor="middle" font-size="9" fill="#94a3b8">gen00 - gen39</text>
  <text x="150" y="177" text-anchor="middle" font-size="9" fill="#64748b">36,000 rows collected</text>
  <text x="150" y="192" text-anchor="middle" font-size="9" fill="#64748b">2s collection interval</text>

  <line x1="240" y1="155" x2="290" y2="155" stroke="#6d28d9" stroke-width="2" marker-end="url(#arw)"/>

  <!-- Dataset box -->
  <rect x="290" y="105" width="180" height="100" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="380" y="128" text-anchor="middle" font-size="11" font-weight="600" fill="#fbbf24">Dataset Split</text>
  <text x="380" y="147" text-anchor="middle" font-size="9" fill="#94a3b8">Run-level 70/15/15</text>
  <text x="380" y="162" text-anchor="middle" font-size="9" fill="#94a3b8">Train: 28 runs</text>
  <text x="380" y="177" text-anchor="middle" font-size="9" fill="#94a3b8">Val: 6 runs · Test: 6 runs</text>
  <text x="380" y="192" text-anchor="middle" font-size="9" fill="#64748b">No temporal leakage</text>

  <line x1="470" y1="155" x2="520" y2="155" stroke="#6d28d9" stroke-width="2" marker-end="url(#arw)"/>

  <!-- Features box -->
  <rect x="520" y="80" width="200" height="230" rx="10" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
  <text x="620" y="102" text-anchor="middle" font-size="11" font-weight="600" fill="#818cf8">Feature Engineering</text>
  <text x="620" y="120" text-anchor="middle" font-size="8.5" fill="#64748b">Per-junction features:</text>
  <text x="540" y="137" font-size="8.5" fill="#94a3b8">  vehicle_count</text>
  <text x="540" y="152" font-size="8.5" fill="#94a3b8">  avg_speed_mps</text>
  <text x="540" y="167" font-size="8.5" fill="#94a3b8">  queue_length</text>
  <text x="540" y="182" font-size="8.5" fill="#94a3b8">  density (vehicles/m)</text>
  <text x="540" y="197" font-size="8.5" fill="#94a3b8">  flow_rate_per_hour</text>
  <text x="540" y="212" font-size="8.5" fill="#94a3b8">  signal_phase</text>
  <text x="540" y="227" font-size="8.5" fill="#94a3b8">  signal_green_fraction</text>
  <text x="540" y="242" font-size="8.5" fill="#94a3b8">  cycle_position_s</text>
  <text x="540" y="257" font-size="8.5" fill="#94a3b8">  hour, day_of_week</text>
  <text x="540" y="272" font-size="8.5" fill="#94a3b8">  count_lag, queue_lag</text>
  <text x="620" y="295" text-anchor="middle" font-size="8" fill="#64748b">600 trees · max_depth 8 · lr 0.06</text>

  <line x1="720" y1="200" x2="770" y2="200" stroke="#6d28d9" stroke-width="2" marker-end="url(#arw)"/>

  <!-- 4 models -->
  <rect x="770" y="90" width="290" height="220" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
  <text x="915" y="112" text-anchor="middle" font-size="11" font-weight="600" fill="#34d399">4 XGBRegressor Models</text>
  <text x="915" y="128" text-anchor="middle" font-size="9" fill="#64748b">One model per horizon</text>

  <rect x="785" y="138" width="255" height="42" rx="6" fill="#1e293b"/>
  <text x="912" y="155" text-anchor="middle" font-size="9.5" font-weight="600" fill="#4ade80">+30s: MAE 3.58 | RMSE 5.16 | R2 0.911</text>
  <text x="912" y="172" text-anchor="middle" font-size="8" fill="#64748b">target_count_30 — best accuracy</text>

  <rect x="785" y="188" width="255" height="42" rx="6" fill="#1e293b"/>
  <text x="912" y="205" text-anchor="middle" font-size="9.5" font-weight="600" fill="#4ade80">+60s: MAE 4.61 | RMSE 6.88 | R2 0.873</text>
  <text x="912" y="222" text-anchor="middle" font-size="8" fill="#64748b">target_count_60</text>

  <rect x="785" y="238" width="255" height="42" rx="6" fill="#1e293b"/>
  <text x="912" y="255" text-anchor="middle" font-size="9.5" font-weight="600" fill="#a3e635">+90s: MAE 4.97 | RMSE 8.34 | R2 0.846</text>
  <text x="912" y="272" text-anchor="middle" font-size="8" fill="#64748b">target_count_90</text>

  <rect x="785" y="288" width="255" height="42" rx="6" fill="#1e293b"/>
  <text x="912" y="305" text-anchor="middle" font-size="9.5" font-weight="600" fill="#fbbf24">+120s: MAE 6.94 | RMSE 11.83 | R2 0.739</text>
  <text x="912" y="322" text-anchor="middle" font-size="8" fill="#64748b">target_count_120 — longest horizon</text>

  <!-- Vertical separator -->
  <line x1="550" y1="340" x2="550" y2="370" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="550" y="365" text-anchor="middle" font-size="10" fill="#475569">INFERENCE</text>

  <!-- Inference pipeline (bottom section) -->
  <text x="550" y="395" text-anchor="middle" font-size="12" font-weight="700" fill="#34d399">INFERENCE PIPELINE (Real-time)</text>

  <!-- Input -->
  <rect x="60" y="410" width="185" height="85" rx="10" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
  <text x="152" y="433" text-anchor="middle" font-size="11" font-weight="600" fill="#818cf8">ITMS Backend</text>
  <text x="152" y="452" text-anchor="middle" font-size="9" fill="#94a3b8">POST /predict</text>
  <text x="152" y="467" text-anchor="middle" font-size="9" fill="#94a3b8">junction_id + live metrics</text>
  <text x="152" y="482" text-anchor="middle" font-size="9" fill="#64748b">every 2000ms</text>

  <line x1="245" y1="453" x2="300" y2="453" stroke="#10b981" stroke-width="2" marker-end="url(#arw2)"/>

  <!-- FastAPI -->
  <rect x="300" y="410" width="200" height="85" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="400" y="433" text-anchor="middle" font-size="11" font-weight="600" fill="#34d399">FastAPI Service</text>
  <text x="400" y="452" text-anchor="middle" font-size="9" fill="#94a3b8">inference/service.py</text>
  <text x="400" y="467" text-anchor="middle" font-size="9" fill="#94a3b8">HTTP port 8100</text>
  <text x="400" y="482" text-anchor="middle" font-size="9" fill="#64748b">GET /health available</text>

  <line x1="500" y1="453" x2="555" y2="453" stroke="#10b981" stroke-width="2" marker-end="url(#arw2)"/>

  <!-- Prediction output -->
  <rect x="555" y="410" width="240" height="85" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="675" y="433" text-anchor="middle" font-size="11" font-weight="600" fill="#34d399">Prediction Output</text>
  <text x="675" y="452" text-anchor="middle" font-size="9" fill="#94a3b8">{30: N, 60: N, 90: N, 120: N}</text>
  <text x="675" y="467" text-anchor="middle" font-size="9" fill="#94a3b8">1.01ms per horizon</text>
  <text x="675" y="482" text-anchor="middle" font-size="9" fill="#64748b">4.53ms all horizons (2000 calls)</text>

  <line x1="795" y1="453" x2="850" y2="453" stroke="#10b981" stroke-width="2" marker-end="url(#arw2)"/>

  <!-- Fallback -->
  <rect x="850" y="410" width="200" height="85" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="950" y="433" text-anchor="middle" font-size="11" font-weight="600" fill="#fbbf24">Fallback Logic</text>
  <text x="950" y="452" text-anchor="middle" font-size="9" fill="#94a3b8">If ML unavailable:</text>
  <text x="950" y="467" text-anchor="middle" font-size="9" fill="#94a3b8">1. Recent valid prediction</text>
  <text x="950" y="482" text-anchor="middle" font-size="9" fill="#94a3b8">2. Deterministic trend</text>

  <!-- Usage in corridor -->
  <rect x="200" y="540" width="700" height="80" rx="12" fill="#0f172a" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="550" y="562" text-anchor="middle" font-size="11" font-weight="700" fill="#a78bfa">Used in Green Corridor Planning</text>
  <text x="550" y="580" text-anchor="middle" font-size="10" fill="#94a3b8">Predicted vehicle count at ETA determines corridor window pressure</text>
  <text x="550" y="597" text-anchor="middle" font-size="10" fill="#64748b">High predicted count at junction ETA  -&gt;  longer green window allocated</text>
  <text x="550" y="612" text-anchor="middle" font-size="9" fill="#64748b">source label: "ml" or "fallback" always included in response</text>

  <!-- Latency bar -->
  <rect x="60" y="655" width="980" height="90" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="550" y="677" text-anchor="middle" font-size="11" font-weight="700" fill="#94a3b8">MODEL PARAMETERS</text>
  <text x="200" y="700" text-anchor="middle" font-size="10" fill="#e2e8f0">objective: reg:squarederror</text>
  <text x="200" y="718" text-anchor="middle" font-size="10" fill="#64748b">n_estimators: 600</text>
  <text x="400" y="700" text-anchor="middle" font-size="10" fill="#e2e8f0">max_depth: 8</text>
  <text x="400" y="718" text-anchor="middle" font-size="10" fill="#64748b">learning_rate: 0.06</text>
  <text x="600" y="700" text-anchor="middle" font-size="10" fill="#e2e8f0">subsample: 0.9</text>
  <text x="600" y="718" text-anchor="middle" font-size="10" fill="#64748b">colsample_bytree: 0.9</text>
  <text x="800" y="700" text-anchor="middle" font-size="10" fill="#e2e8f0">tree_method: hist</text>
  <text x="800" y="718" text-anchor="middle" font-size="10" fill="#64748b">random_state: 42</text>
  <text x="1000" y="700" text-anchor="middle" font-size="10" fill="#e2e8f0">n_jobs: 4</text>
  <text x="1000" y="718" text-anchor="middle" font-size="10" fill="#64748b">reg_lambda: 1.0</text>

  <text x="550" y="762" text-anchor="middle" font-size="9" fill="#475569">Bitcoders · SISTec Innovation Hackathon 2026</text>
</svg>
